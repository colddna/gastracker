<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas Tracker</title>
  <style>
    /* Calm, low-contrast surroundings so the numbers carry the page. */
    :root {
      --bg: #EEF2F0;
      --surface: #FFFFFF;
      --surface-soft: #F6F9F8;
      --border: #D9E2DF;
      --text: #263634;
      --muted: #6A7C79;
      --accent: #4F8379;          /* sage teal: buttons, key figures */
      --accent-soft: #DDEBE7;
      --accent-ink: #2F5F56;      /* darker teal for big numbers */
      --danger: #B0645C;
      --danger-soft: #F6E7E5;
      --shadow: 0 1px 2px rgba(38, 54, 52, 0.05), 0 4px 16px rgba(38, 54, 52, 0.06);
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161D1C;
        --surface: #1F2827;
        --surface-soft: #243030;
        --border: #314140;
        --text: #E4ECEA;
        --muted: #93A6A2;
        --accent: #79B3A7;
        --accent-soft: #2A3D3A;
        --accent-ink: #A6D5CB;
        --danger: #D48D85;
        --danger-soft: #3A2A28;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem) 4rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header { margin-bottom: 1.75rem; }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline { color: var(--muted); }

    h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    section { margin-bottom: 2rem; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    /* ---------- Form ---------- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 1rem;
      align-items: start;
    }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }

    .field label { font-size: 0.9rem; font-weight: 600; }

    .input-wrap { position: relative; }

    .input-wrap .prefix,
    .input-wrap .suffix {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
      pointer-events: none;
    }
    .input-wrap .prefix { left: 0.85rem; }
    .input-wrap .suffix { right: 0.85rem; }

    input {
      width: 100%;
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-wrap.has-prefix input { padding-left: 1.7rem; }
    .input-wrap.has-suffix input { padding-right: 2.6rem; }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px var(--danger-soft);
    }

    input[type="date"] { color-scheme: light dark; }

    .error {
      color: var(--danger);
      font-size: 0.82rem;
      min-height: 1.2em;
    }

    .actions { padding-top: 1.75rem; }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--accent-ink); }
    @media (prefers-color-scheme: dark) {
      .btn-primary { color: #10201D; }
      .btn-primary:hover { background: var(--accent-ink); }
    }

    .preview {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.5em;
    }
    .preview strong { color: var(--accent-ink); font-variant-numeric: tabular-nums; }

    /* ---------- Totals ---------- */
    .totals {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .total-card { padding: 1.1rem 1.25rem; }

    .total-card .period {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }
    .total-card .range { font-size: 0.78rem; color: var(--muted); opacity: 0.85; }

    .total-card .amount {
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: 700;
      color: var(--accent-ink);
      font-variant-numeric: tabular-nums;
      margin: 0.35rem 0 0.15rem;
      letter-spacing: -0.01em;
    }

    .total-card .detail {
      font-size: 0.88rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Card deck ---------- */
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .deck-header h2 { margin-bottom: 0; }
    .deck-summary { font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    .deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
      list-style: none;
    }

    .fill-card {
      position: relative;
      padding: 1.1rem 1.25rem 1rem;
      border-top: 4px solid var(--accent);
      animation: rise 0.3s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fill-card .date { font-size: 0.9rem; font-weight: 600; color: var(--muted); }

    .fill-card .cost {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--accent-ink);
      font-variant-numeric: tabular-nums;
      margin: 0.2rem 0 0.75rem;
      letter-spacing: -0.01em;
    }

    .fill-card dl {
      display: grid;
      grid-template-columns: 1fr auto;
      row-gap: 0.3rem;
      font-size: 0.92rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .fill-card dt { color: var(--muted); }
    .fill-card dd { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    .remove-btn {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.25rem 0.55rem;
    }
    .remove-btn:hover {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: var(--danger-soft);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .hidden { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 760px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .actions { grid-column: 1 / -1; padding-top: 0; }
      .btn-primary { width: 100%; }
    }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .totals { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill-card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gas Tracker</h1>
      <p class="tagline">Log each fill-up and see what you're spending.</p>
    </header>

    <!-- ---------- Add a fill-up ---------- -->
    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a fill-up</h2>
      <form class="panel" id="fill-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="gallons">Gallons</label>
            <div class="input-wrap has-suffix">
              <input type="text" id="gallons" inputmode="decimal" autocomplete="off" placeholder="0.00"
                     aria-describedby="gallons-error" />
              <span class="suffix">gal</span>
            </div>
            <span class="error" id="gallons-error"></span>
          </div>

          <div class="field">
            <label for="price">Price per gallon</label>
            <div class="input-wrap has-prefix">
              <span class="prefix">$</span>
              <input type="text" id="price" inputmode="decimal" autocomplete="off" placeholder="0.00"
                     aria-describedby="price-error" />
            </div>
            <span class="error" id="price-error"></span>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" aria-describedby="date-error" />
            <span class="error" id="date-error"></span>
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary">Add fill-up</button>
          </div>
        </div>
        <p class="preview" id="preview" aria-live="polite"></p>
      </form>
    </section>

    <!-- ---------- Running totals ---------- -->
    <section aria-labelledby="totals-heading">
      <h2 id="totals-heading">Running totals</h2>
      <div class="totals" id="totals"></div>
    </section>

    <!-- ---------- Card deck ---------- -->
    <section aria-labelledby="deck-heading">
      <div class="deck-header">
        <h2 id="deck-heading">Fill-up history</h2>
        <span class="deck-summary" id="deck-summary"></span>
      </div>
      <ul class="deck" id="deck"></ul>
      <p class="empty hidden" id="empty">No fill-ups yet. Add your first one above.</p>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'gasTracker.fillUps';
    // Accepts "3", "3.5", "3.99", ".99" and "3." (at least one digit, at most 2 decimals).
    const TWO_DECIMALS = /^(?=.*\d)\d*(\.\d{0,2})?$/;

    const $ = (id) => document.getElementById(id);
    const form = $('fill-form');
    const gallonsInput = $('gallons');
    const priceInput = $('price');
    const dateInput = $('date');
    const previewEl = $('preview');

    const money = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' });
    const num2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // ---------------------------------------------------------------
    // Storage
    // ---------------------------------------------------------------
    function loadFillUps() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveFillUps() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fillUps));
    }

    let fillUps = loadFillUps();

    // ---------------------------------------------------------------
    // Dates (all local time; stored as "YYYY-MM-DD")
    // ---------------------------------------------------------------
    const pad = (n) => String(n).padStart(2, '0');
    const toISODate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    function parseISODate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function startOfWeek(d) {                        // weeks run Sunday to Saturday
      const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      s.setDate(s.getDate() - s.getDay());
      return s;
    }

    const fmtShort = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const fmtCard = (d) => d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

    // ---------------------------------------------------------------
    // Input: digits and one dot, never more than 2 decimal places
    // ---------------------------------------------------------------
    function limitDecimals(input) {
      let v = input.value.replace(/[^\d.]/g, '');
      const firstDot = v.indexOf('.');
      if (firstDot !== -1) {
        v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '').slice(0, 2);
      }
      if (v !== input.value) input.value = v;
    }

    [gallonsInput, priceInput].forEach((input) => {
      input.addEventListener('input', () => {
        limitDecimals(input);
        clearError(input);
        updatePreview();
      });
    });
    dateInput.addEventListener('input', () => clearError(dateInput));

    function setError(input, msg) {
      input.setAttribute('aria-invalid', 'true');
      $(input.id + '-error').textContent = msg;
    }

    function clearError(input) {
      input.removeAttribute('aria-invalid');
      $(input.id + '-error').textContent = '';
    }

    function validateAmount(input, label) {
      const v = input.value.trim();
      if (v === '') return setError(input, `${label} is required.`), null;
      if (!TWO_DECIMALS.test(v)) return setError(input, 'Use a number with up to 2 decimals.'), null;
      const n = Number(v);
      if (n <= 0) return setError(input, `${label} must be more than 0.`), null;
      return n;
    }

    function validateDate() {
      const v = dateInput.value;
      if (!v) return setError(dateInput, 'Date is required.'), null;
      // Future dates are allowed; the totals only count dates inside each period's range.
      return v;
    }

    const costOf = (gallons, price) => Math.round(gallons * price * 100) / 100;

    function updatePreview() {
      const g = Number(gallonsInput.value);
      const p = Number(priceInput.value);
      previewEl.innerHTML = '';
      if (TWO_DECIMALS.test(gallonsInput.value) && TWO_DECIMALS.test(priceInput.value) && g > 0 && p > 0) {
        previewEl.append('This fill-up comes to ');
        const strong = document.createElement('strong');
        strong.textContent = money.format(costOf(g, p));
        previewEl.append(strong, '.');
      }
    }

    // ---------------------------------------------------------------
    // Sound: a cash-register "cha-ching", synthesized with the Web Audio API
    // ---------------------------------------------------------------
    let audioCtx = null;
    let noiseBuffer = null;

    // One metallic "tink": a few inharmonic partials that ring and fade, plus a tiny tap of noise.
    function clink(ctx, out, time, freq, volume) {
      const partials = [[1, 1], [2.76, 0.5], [5.4, 0.25], [8.93, 0.12]];
      for (const [ratio, amp] of partials) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const decay = 0.35 / Math.sqrt(ratio);
        osc.type = 'sine';
        osc.frequency.value = freq * ratio;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(volume * amp * 0.25, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);
        osc.connect(gain).connect(out);
        osc.start(time);
        osc.stop(time + decay + 0.05);
      }

      const tap = ctx.createBufferSource();
      const tapFilter = ctx.createBiquadFilter();
      const tapGain = ctx.createGain();
      tap.buffer = noiseBuffer;
      tapFilter.type = 'highpass';
      tapFilter.frequency.value = 3000;
      tapGain.gain.setValueAtTime(volume * 0.2, time);
      tapGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
      tap.connect(tapFilter).connect(tapGain).connect(out);
      tap.start(time);
      tap.stop(time + 0.04);
    }

    // The "cha": a short mechanical clack, like a register drawer releasing.
    function clack(ctx, out, time) {
      const src = ctx.createBufferSource();
      const band = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      src.buffer = noiseBuffer;
      band.type = 'bandpass';
      band.frequency.value = 1800;
      band.Q.value = 1.2;
      gain.gain.setValueAtTime(0.9, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
      src.connect(band).connect(gain).connect(out);
      src.start(time);
      src.stop(time + 0.05);

      const thunk = ctx.createOscillator();
      const thunkGain = ctx.createGain();
      thunk.type = 'triangle';
      thunk.frequency.setValueAtTime(320, time);
      thunk.frequency.exponentialRampToValueAtTime(110, time + 0.06);
      thunkGain.gain.setValueAtTime(0.35, time);
      thunkGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
      thunk.connect(thunkGain).connect(out);
      thunk.start(time);
      thunk.stop(time + 0.1);
    }

    // The "ching": a bright register bell that rings out, with a slight shimmer.
    function bell(ctx, out, time, freq) {
      const partials = [[1, 1, 1.4], [2.0, 0.45, 0.9], [2.76, 0.3, 0.7], [4.07, 0.18, 0.45], [5.4, 0.1, 0.3]];
      for (const [ratio, amp, decay] of partials) {
        for (const detune of [-4, 4]) {               // two slightly detuned copies -> shimmer
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq * ratio;
          osc.detune.value = detune;
          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(amp * 0.16, time + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);
          osc.connect(gain).connect(out);
          osc.start(time);
          osc.stop(time + decay + 0.05);
        }
      }
    }

    function playChaChing() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const master = audioCtx.createGain();
        master.gain.value = 0.5;
        master.connect(audioCtx.destination);

        const t = audioCtx.currentTime + 0.02;
        clack(audioCtx, master, t);                   // "cha"
        bell(audioCtx, master, t + 0.11, 2350);       // "ching"

        // A few coins settling in the drawer under the ring.
        for (let i = 0; i < 4; i++) {
          clink(audioCtx, master, t + 0.2 + i * 0.07 + Math.random() * 0.04,
                3000 + Math.random() * 1500, 0.35 - i * 0.06);
        }
      } catch {
        // No Web Audio support: the fill-up is still saved, just silently.
      }
    }

    // ---------------------------------------------------------------
    // Submit
    // ---------------------------------------------------------------
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const gallons = validateAmount(gallonsInput, 'Gallons');
      const price = validateAmount(priceInput, 'Price');
      const date = validateDate();

      if (gallons === null || price === null || date === null) {
        form.querySelector('[aria-invalid="true"]').focus();
        return;
      }

      fillUps.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        date,
        gallons,
        price,
        createdAt: Date.now(),
      });
      saveFillUps();
      playChaChing();

      gallonsInput.value = '';
      priceInput.value = '';
      dateInput.value = toISODate(new Date());
      updatePreview();
      render();
      gallonsInput.focus();
    });

    // ---------------------------------------------------------------
    // Render: totals + card deck
    // ---------------------------------------------------------------
    function summarize(list) {
      return list.reduce(
        (acc, f) => {
          acc.cost += costOf(f.gallons, f.price);
          acc.gallons += f.gallons;
          acc.count++;
          return acc;
        },
        { cost: 0, gallons: 0, count: 0 }
      );
    }

    function renderTotals() {
      const now = new Date();
      const today = toISODate(now);
      const weekStart = startOfWeek(now);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      const weekStartISO = toISODate(weekStart);
      const weekEndISO = toISODate(weekEnd);
      const monthPrefix = today.slice(0, 7);

      const periods = [
        { name: 'Today', range: fmtShort(now), match: (d) => d === today },
        { name: 'This week', range: `${fmtShort(weekStart)} – ${fmtShort(weekEnd)}`, match: (d) => d >= weekStartISO && d <= weekEndISO },
        { name: 'This month', range: now.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }), match: (d) => d.startsWith(monthPrefix) },
      ];

      const container = $('totals');
      container.innerHTML = '';
      for (const p of periods) {
        const s = summarize(fillUps.filter((f) => p.match(f.date)));
        const card = document.createElement('div');
        card.className = 'panel total-card';
        card.innerHTML = `
          <div class="period"></div>
          <div class="range"></div>
          <div class="amount"></div>
          <div class="detail"></div>`;
        card.querySelector('.period').textContent = p.name;
        card.querySelector('.range').textContent = p.range;
        card.querySelector('.amount').textContent = money.format(s.cost);
        card.querySelector('.detail').textContent =
          `${num2.format(s.gallons)} gal · ${s.count} fill-up${s.count === 1 ? '' : 's'}`;
        container.appendChild(card);
      }
    }

    function renderDeck() {
      const deck = $('deck');
      deck.innerHTML = '';

      // Newest fill-up date first; same date -> most recently added first.
      const sorted = [...fillUps].sort((a, b) =>
        b.date.localeCompare(a.date) || b.createdAt - a.createdAt
      );

      for (const f of sorted) {
        const li = document.createElement('li');
        li.className = 'panel fill-card';
        li.innerHTML = `
          <button type="button" class="remove-btn">Remove</button>
          <div class="date"></div>
          <div class="cost"></div>
          <dl>
            <dt>Gallons</dt><dd class="g"></dd>
            <dt>Price / gal</dt><dd class="p"></dd>
          </dl>`;
        const dateLabel = fmtCard(parseISODate(f.date));
        li.querySelector('.date').textContent = dateLabel;
        li.querySelector('.cost').textContent = money.format(costOf(f.gallons, f.price));
        li.querySelector('.g').textContent = num2.format(f.gallons);
        li.querySelector('.p').textContent = money.format(f.price);

        const btn = li.querySelector('.remove-btn');
        btn.setAttribute('aria-label', `Remove fill-up from ${dateLabel}`);
        btn.addEventListener('click', () => {
          if (!confirm(`Remove the ${dateLabel} fill-up?`)) return;
          fillUps = fillUps.filter((x) => x.id !== f.id);
          saveFillUps();
          render();
        });

        deck.appendChild(li);
      }

      const all = summarize(fillUps);
      $('empty').classList.toggle('hidden', fillUps.length > 0);
      $('deck-summary').textContent = fillUps.length
        ? `${all.count} fill-up${all.count === 1 ? '' : 's'} · ${money.format(all.cost)} all time`
        : '';
    }

    function render() {
      renderTotals();
      renderDeck();
    }

    // ---------------------------------------------------------------
    // Init
    // ---------------------------------------------------------------
    dateInput.value = toISODate(new Date());
    render();
  </script>
</body>
</html>
